<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoreCrafters - Online Test Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-2">
      <span class="text-2xl font-black text-yellow-400 tracking-wider">SCORECRAFTERS</span>
      <span class="bg-blue-600 text-xs text-white px-2 py-0.5 rounded font-bold">MOCK TEST</span>
    </div>

    <!-- User Profile / Auth Area -->
    <div id="authArea" class="flex items-center space-x-3">
      <button id="loginBtn" onclick="loginWithGoogle()" class="bg-white hover:bg-gray-100 text-gray-800 font-bold px-4 py-1.5 rounded-lg text-sm transition flex items-center space-x-2 shadow">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Sign in with Google</span>
      </button>

      <div id="userInfo" class="hidden flex items-center space-x-2">
        <img id="userAvatar" class="w-8 h-8 rounded-full border border-yellow-400" src="" alt="User">
        <span id="userName" class="text-xs font-semibold text-gray-200 hidden sm:inline"></span>
        <button onclick="logout()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-gray-300">Logout</button>
      </div>
    </div>

    <div id="timerBox" class="hidden bg-red-900/80 border border-red-500 text-red-200 text-sm font-mono px-3 py-1 rounded-lg animate-pulse">
      Time Remaining: <span id="time" class="font-bold text-white">00:00</span>
    </div>
  </header>

  <!-- Setup Screen -->
  <main id="setupScreen" class="flex-1 flex justify-center items-center p-6">
    <div class="bg-gray-800 border border-gray-700 p-8 rounded-2xl max-w-md w-full shadow-2xl text-center">
      <h2 class="text-2xl font-bold text-yellow-400 mb-2">Select Your Exam</h2>
      <p class="text-xs text-gray-400 mb-6">Apna exam chunen aur live test start karein</p>

      <div class="mb-6 text-left">
        <label class="block text-xs font-semibold text-gray-300 mb-2">TARGET EXAM:</label>
        <select id="examSelect" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white font-semibold">
          <option value="UPSSSC PET">UPSSSC PET</option>
          <option value="UP Police SI">UP Police SI (Daroga)</option>
          <option value="UP Police Constable">UP Police Constable</option>
          <option value="RPF Constable">RPF Constable</option>
          <option value="RPF SI">RPF SI</option>
        </select>
      </div>

      <button onclick="startTest()" id="startBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-extrabold py-3 rounded-lg transition shadow-lg text-lg">
        🚀 Start Mock Test
      </button>
    </div>
  </main>

  <!-- Test Interface -->
  <div id="testInterface" class="hidden flex-1 flex flex-col md:flex-row h-[calc(100vh-65px)]">
    <div class="flex-1 p-6 overflow-y-auto flex flex-col justify-between">
      <div>
        <div id="subjectTabs" class="flex space-x-2 border-b border-gray-700 pb-3 mb-6 overflow-x-auto"></div>
        <div class="flex justify-between items-center mb-4 text-xs text-gray-400">
          <span id="qIndex" class="font-bold text-yellow-400 text-sm">Question #1</span>
          <span class="bg-gray-800 px-2 py-1 rounded border border-gray-700">+1.0 / -0.25 Marks</span>
        </div>
        <div id="qText" class="text-lg font-medium text-gray-100 mb-6 bg-gray-800/50 p-4 rounded-xl border border-gray-700"></div>
        <div id="optionsContainer" class="space-y-3"></div>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-gray-800 mt-6">
        <button onclick="prevQuestion()" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold px-5 py-2 rounded-lg transition text-sm">⬅️ Previous</button>
        <button onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2 rounded-lg transition text-sm">Next ➡️</button>
      </div>
    </div>

    <div class="w-full md:w-80 bg-gray-800 border-l border-gray-700 p-4 flex flex-col justify-between">
      <div>
        <h3 class="text-xs font-bold text-gray-400 mb-3 tracking-wider">QUESTION PALETTE</h3>
        <div id="paletteGrid" class="grid grid-cols-5 gap-2 max-h-96 overflow-y-auto p-1"></div>
      </div>

      <button onclick="submitTest()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition shadow-md mt-6">
        ✅ Submit Test
      </button>
    </div>
  </div>

  <!-- Result & Solutions Modal -->
  <div id="resultModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="text-center border-b border-gray-700 pb-4 mb-4">
        <h2 class="text-2xl font-bold text-yellow-400">Mock Test Result</h2>
        <p id="resultExamTitle" class="text-xs text-gray-400"></p>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="bg-gray-700/50 p-3 rounded-xl border border-gray-600 text-center">
          <span class="block text-xs text-gray-400">Total Score</span>
          <span id="resScore" class="text-xl font-black text-yellow-400">0</span>
        </div>
        <div class="bg-gray-700/50 p-3 rounded-xl border border-gray-600 text-center">
          <span class="block text-xs text-gray-400">Correct</span>
          <span id="resCorrect" class="text-xl font-black text-green-400">0</span>
        </div>
        <div class="bg-gray-700/50 p-3 rounded-xl border border-gray-600 text-center">
          <span class="block text-xs text-gray-400">Incorrect</span>
          <span id="resWrong" class="text-xl font-black text-red-400">0</span>
        </div>
        <div class="bg-gray-700/50 p-3 rounded-xl border border-gray-600 text-center">
          <span class="block text-xs text-gray-400">Accuracy</span>
          <span id="resAccuracy" class="text-xl font-black text-blue-400">0%</span>
        </div>
      </div>

      <div class="border-t border-gray-700 pt-4">
        <h3 class="text-lg font-bold text-yellow-400 mb-3">Detailed Solutions & Explanations</h3>
        <div id="solutionsList" class="space-y-4"></div>
      </div>

      <button onclick="location.reload()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg mt-6 transition">
        🔄 Re-take Test
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      projectId: "scorecrafter-b4ff1",
      authDomain: "scorecrafter-b4ff1.firebaseapp.com",
      storageBucket: "scorecrafter-b4ff1.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let currentQuestions = [];
    let userAnswers = {};
    let currentIndex = 0;
    let selectedExam = "";

    // Auth Observer
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("loginBtn").classList.add("hidden");
        document.getElementById("userInfo").classList.remove("hidden");
        document.getElementById("userName").innerText = user.displayName || "Student";
        document.getElementById("userAvatar").src = user.photoURL || "https://via.placeholder.com/32";
      } else {
        currentUser = null;
        document.getElementById("loginBtn").classList.remove("hidden");
        document.getElementById("userInfo").classList.add("hidden");
      }
    });

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("Login Error: " + err.message));
    }

    function logout() {
      auth.signOut();
    }

    async function startTest() {
      if (!currentUser) {
        alert("Pehle Google Login karein taaki aapka result aur rank save ho sake!");
        loginWithGoogle();
        return;
      }

      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = true;
      startBtn.innerText = "⏳ Loading Questions...";

      selectedExam = document.getElementById("examSelect").value;

      try {
        const snapshot = await db.collection("questions")
          .where("exam", "==", selectedExam)
          .get();

        currentQuestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        if (currentQuestions.length === 0) {
          alert("Is Exam ke abhi tak koi questions add nahi hue hain!");
          startBtn.disabled = false;
          startBtn.innerText = "🚀 Start Mock Test";
          return;
        }

        document.getElementById("setupScreen").classList.add("hidden");
        document.getElementById("testInterface").classList.remove("hidden");
        document.getElementById("timerBox").classList.remove("hidden");

        renderSubjects();
        loadQuestion(0);
        renderPalette();
      } catch (err) {
        alert("Error fetching test: " + err.message);
        startBtn.disabled = false;
        startBtn.innerText = "🚀 Start Mock Test";
      }
    }

    function renderSubjects() {
      const subjects = [...new Set(currentQuestions.map(q => q.subject))];
      const tabs = document.getElementById("subjectTabs");
      tabs.innerHTML = "";

      subjects.forEach((sub, idx) => {
        const btn = document.createElement("button");
        btn.className = `px-3 py-1 rounded-md text-xs font-bold transition ${idx === 0 ? 'bg-yellow-500 text-gray-900' : 'bg-gray-700 text-gray-300'}`;
        btn.innerText = sub;
        btn.onclick = () => {
          const firstSubIndex = currentQuestions.findIndex(q => q.subject === sub);
          if (firstSubIndex !== -1) loadQuestion(firstSubIndex);
        };
        tabs.appendChild(btn);
      });
    }

    function loadQuestion(index) {
      currentIndex = index;
      const q = currentQuestions[index];

      document.getElementById("qIndex").innerText = `Question #${index + 1} (${q.subject})`;
      document.getElementById("qText").innerText = q.question;

      const optsBox = document.getElementById("optionsContainer");
      optsBox.innerHTML = "";

      ["A", "B", "C", "D"].forEach(key => {
        const isSelected = userAnswers[q.id] === key;
        const div = document.createElement("div");
        div.className = `p-3 rounded-lg border transition cursor-pointer flex items-center space-x-3 ${isSelected ? 'bg-yellow-500/20 border-yellow-500 text-yellow-300' : 'bg-gray-800 border-gray-700 hover:bg-gray-750'}`;
        div.onclick = () => selectOption(q.id, key);

        div.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-gray-700 border border-gray-600 flex items-center justify-center font-bold text-xs">${key}</span>
          <span class="text-sm font-medium">${q.options[key]}</span>
        `;
        optsBox.appendChild(div);
      });

      renderPalette();
    }

    function selectOption(qId, key) {
      userAnswers[qId] = key;
      loadQuestion(currentIndex);
    }

    function prevQuestion() {
      if (currentIndex > 0) loadQuestion(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
    }

    function renderPalette() {
      const grid = document.getElementById("paletteGrid");
      grid.innerHTML = "";

      currentQuestions.forEach((q, idx) => {
        const btn = document.createElement("button");
        const isAns = userAnswers[q.id];
        const isCurr = idx === currentIndex;

        btn.className = `h-8 text-xs font-bold rounded ${isCurr ? 'ring-2 ring-yellow-400' : ''} ${isAns ? 'bg-green-600 text-white' : 'bg-gray-700 text-gray-300'}`;
        btn.innerText = idx + 1;
        btn.onclick = () => loadQuestion(idx);
        grid.appendChild(btn);
      });
    }

    async function submitTest() {
      if (!confirm("Kya aap sach mein Test Submit karna chahte hain?")) return;

      let correct = 0;
      let wrong = 0;

      currentQuestions.forEach(q => {
        const ans = userAnswers[q.id];
        if (ans) {
          if (ans === q.correctAnswer) correct++;
          else wrong++;
        }
      });

      const totalAttempted = correct + wrong;
      const score = (correct * 1) - (wrong * 0.25);
      const accuracy = totalAttempted > 0 ? ((correct / totalAttempted) * 100).toFixed(1) : 0;

      // Save Test Result to Firebase Leaderboard
      if (currentUser) {
        try {
          await db.collection("results").add({
            userId: currentUser.uid,
            userName: currentUser.displayName,
            userPhoto: currentUser.photoURL,
            exam: selectedExam,
            score: score,
            correct: correct,
            wrong: wrong,
            accuracy: accuracy,
            submittedAt: Date.now()
          });
        } catch (err) {
          console.error("Result save error:", err);
        }
      }

      document.getElementById("resScore").innerText = score;
      document.getElementById("resCorrect").innerText = correct;
      document.getElementById("resWrong").innerText = wrong;
      document.getElementById("resAccuracy").innerText = accuracy + "%";
      document.getElementById("resultExamTitle").innerText = selectedExam;

      const solList = document.getElementById("solutionsList");
      solList.innerHTML = "";

      currentQuestions.forEach((q, i) => {
        const userAns = userAnswers[q.id] || "Not Attempted";
        const isRight = userAns === q.correctAnswer;

        const card = document.createElement("div");
        card.className = "bg-gray-700/40 p-4 rounded-xl border border-gray-600 text-sm";

        card.innerHTML = `
          <div class="font-bold text-gray-200 mb-2">Q${i+1}. ${q.question}</div>
          <div class="grid grid-cols-2 gap-2 text-xs mb-2">
            <div class="${isRight ? 'text-green-400' : 'text-red-400'} font-semibold">Your Answer: ${userAns}</div>
            <div class="text-green-400 font-semibold">Correct Answer: Option ${q.correctAnswer}</div>
          </div>
          <div class="bg-gray-800 p-2 rounded border border-gray-700 text-xs text-gray-300">
            <span class="font-bold text-yellow-400 block mb-1">💡 Solution / Vyakhya:</span>
            ${q.explanation || "Is question ki vyakhya uplabdh nahi hai."}
          </div>
        `;
        solList.appendChild(card);
      });

      document.getElementById("resultModal").classList.remove("hidden");
    }
  </script>
</body>
</html>
