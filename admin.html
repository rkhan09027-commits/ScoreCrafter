<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoreCrafters - Admin Panel (Cloud)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

  <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
    <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
      <div>
        <h1 class="text-2xl font-bold text-yellow-400">ScoreCrafters</h1>
        <p class="text-xs text-gray-400">Cloud Live Admin Panel</p>
      </div>
      <span class="bg-green-500/10 text-green-400 text-xs px-3 py-1 rounded-full border border-green-500/20 font-semibold flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Cloud Live
      </span>
    </div>

    <!-- Subject Limit Counter Badge -->
    <div id="counterBadge" class="bg-blue-900 border border-blue-500 text-blue-200 text-sm font-semibold p-3 rounded-lg mb-6 flex justify-between items-center">
      <span id="targetSubjectName">Subject Status:</span>
      <span id="targetCountText" class="text-yellow-400 font-bold text-base">Loading...</span>
    </div>

    <form id="questionForm">
      
      <!-- Select Exam -->
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Select Exam:</label>
        <select id="examSelect" onchange="updateSubjects()" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
          <option value="UPSSSC PET">UPSSSC PET</option>
          <option value="UP Police SI">UP Police SI (Daroga)</option>
          <option value="UP Police Constable">UP Police Constable</option>
          <option value="RPF Constable">RPF Constable</option>
          <option value="RPF SI">RPF SI</option>
        </select>
      </div>

      <!-- Select Subject -->
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Select Subject:</label>
        <select id="subjectSelect" onchange="updateCounter()" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
          <!-- Dynamic Subjects -->
        </select>
      </div>

      <!-- Question Text (Hindi Only) -->
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Question (Hindi):</label>
        <textarea id="qHi" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600" rows="3" placeholder="Sawaal yahan type karein..."></textarea>
      </div>

      <!-- 4 Options (Hindi) -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Option A</label>
          <input type="text" id="optA" required placeholder="Option A" class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Option B</label>
          <input type="text" id="optB" required placeholder="Option B" class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Option C</label>
          <input type="text" id="optC" required placeholder="Option C" class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Option D</label>
          <input type="text" id="optD" required placeholder="Option D" class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        </div>
      </div>

      <!-- Correct Answer Dropdown -->
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1 text-yellow-400">Select Correct Answer (Sahi Option):</label>
        <select id="correctAns" required class="w-full p-2 bg-gray-700 rounded text-white border border-yellow-500 font-bold">
          <option value="">-- Choose Correct Option --</option>
          <option value="A">Option A</option>
          <option value="B">Option B</option>
          <option value="C">Option C</option>
          <option value="D">Option D</option>
        </select>
      </div>

      <!-- Explanation / Solution Box -->
      <div class="mb-6">
        <label class="block text-sm font-semibold mb-1 text-green-400">Solution / Vyakhya (Optional):</label>
        <textarea id="explanation" class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600" rows="2" placeholder="Sahi jawab ka karan ya detail vyakhya yahan likhein..."></textarea>
      </div>

      <!-- Submit / Add Next Question Button -->
      <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition shadow-md flex justify-center items-center gap-2">
        <span>➕ Save & Upload To Cloud</span>
      </button>

    </form>

    <div id="statusMsg" class="mt-4 text-center font-semibold text-green-400 hidden"></div>
  </div>

  <script>
    // Firebase Config Integrated with your Project ID
    const firebaseConfig = {
      projectId: "scorecrafter-b4ff1",
      authDomain: "scorecrafter-b4ff1.firebaseapp.com",
      storageBucket: "scorecrafter-b4ff1.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const examRules = {
      "UPSSSC PET": {
        "General Knowledge (GK/GS)": 50,
        "Maths (Graph & Elementary)": 30,
        "General Hindi": 20,
        "General English": 5
      },
      "UP Police SI": {
        "General Knowledge": 40,
        "General Hindi": 40,
        "Numerical Ability (Maths)": 40,
        "Reasoning Ability": 40
      },
      "UP Police Constable": {
        "General Knowledge": 38,
        "General Hindi": 37,
        "Numerical Ability": 38,
        "Reasoning": 37
      },
      "RPF Constable": {
        "General Awareness": 50,
        "Arithmetic (Maths)": 35,
        "General Intelligence & Reasoning": 35
      },
      "RPF SI": {
        "General Awareness": 50,
        "Arithmetic (Maths)": 35,
        "General Intelligence & Reasoning": 35
      }
    };

    function updateSubjects() {
      const selectedExam = document.getElementById("examSelect").value;
      const subjectDropdown = document.getElementById("subjectSelect");
      subjectDropdown.innerHTML = "";
      
      const subjects = Object.keys(examRules[selectedExam] || examRules["UPSSSC PET"]);
      subjects.forEach(sub => {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.innerText = `${sub} (Target: ${examRules[selectedExam][sub]})`;
        subjectDropdown.appendChild(opt);
      });

      updateCounter();
    }

    async function updateCounter() {
      const selectedExam = document.getElementById("examSelect").value;
      const selectedSubject = document.getElementById("subjectSelect").value;
      const targetLimit = examRules[selectedExam][selectedSubject] || 50;

      document.getElementById("targetCountText").innerText = "Syncing...";

      try {
        const snapshot = await db.collection("questions")
          .where("exam", "==", selectedExam)
          .where("subject", "==", selectedSubject)
          .get();

        const currentCount = snapshot.size;

        document.getElementById("targetSubjectName").innerText = `${selectedSubject}:`;
        document.getElementById("targetCountText").innerText = `${currentCount} / ${targetLimit} Added`;

        if (currentCount >= targetLimit) {
          document.getElementById("counterBadge").className = "bg-green-900 border border-green-500 text-green-200 text-sm font-semibold p-3 rounded-lg mb-6 flex justify-between items-center";
        } else {
          document.getElementById("counterBadge").className = "bg-blue-900 border border-blue-500 text-blue-200 text-sm font-semibold p-3 rounded-lg mb-6 flex justify-between items-center";
        }
      } catch (err) {
        document.getElementById("targetCountText").innerText = "0 / " + targetLimit;
      }
    }

    updateSubjects();

    document.getElementById("questionForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "⏳ Saving to Cloud...";

      const selectedExam = document.getElementById("examSelect").value;
      const selectedSubject = document.getElementById("subjectSelect").value;
      const targetLimit = examRules[selectedExam][selectedSubject] || 50;

      const snapshot = await db.collection("questions")
        .where("exam", "==", selectedExam)
        .where("subject", "==", selectedSubject)
        .get();

      const currentCount = snapshot.size;

      if (currentCount >= targetLimit) {
        alert(`Is Subject (${selectedSubject}) ke poore ${targetLimit} questions pehle hi add ho chuke hain! Ab agla subject select karein.`);
        btn.disabled = false;
        btn.innerText = "➕ Save & Upload To Cloud";
        return;
      }

      const newQuestion = {
        createdAt: Date.now(),
        exam: selectedExam,
        subject: selectedSubject,
        question: document.getElementById("qHi").value,
        options: {
          A: document.getElementById("optA").value,
          B: document.getElementById("optB").value,
          C: document.getElementById("optC").value,
          D: document.getElementById("optD").value
        },
        correctAnswer: document.getElementById("correctAns").value,
        explanation: document.getElementById("explanation").value
      };

      try {
        await db.collection("questions").add(newQuestion);

        const statusMsg = document.getElementById("statusMsg");
        statusMsg.innerText = `✅ Cloud Saved! (${currentCount + 1}/${targetLimit})`;
        statusMsg.classList.remove("hidden");

        document.getElementById("questionForm").reset();
        document.getElementById("examSelect").value = selectedExam;
        document.getElementById("subjectSelect").value = selectedSubject;
        document.getElementById("qHi").focus();

        updateCounter();
        setTimeout(() => { statusMsg.classList.add("hidden"); }, 2500);
      } catch (error) {
        alert("Error saving question: " + error.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "➕ Save & Upload To Cloud";
      }
    });
  </script>
</body>
</html>
