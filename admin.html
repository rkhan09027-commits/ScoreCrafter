<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoreCrafters - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">

  <div class="max-w-3xl mx-auto bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-2xl">
    <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
      <h1 class="text-2xl font-black text-yellow-400">ScoreCrafters Admin Panel</h1>
      <span class="bg-yellow-500/10 text-yellow-400 text-xs font-bold px-3 py-1 rounded-full border border-yellow-500/30">Question Upload</span>
    </div>

    <form id="questionForm" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Target Exam Name</label>
          <input type="text" id="examName" placeholder="e.g. UP Police SI" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Subject</label>
          <input type="text" id="subjectName" placeholder="e.g. Hindi / Samanya Gyan" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-yellow-400 mb-1">Test Series Price (₹)</label>
          <input type="number" id="testPrice" placeholder="0 for Free, 99 for Paid" class="w-full bg-gray-700 border border-yellow-500/50 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" value="0" required>
        </div>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Question Text (Hindi/English)</label>
        <textarea id="questionText" rows="3" placeholder="Sawal likhein..." class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <input type="text" id="optA" placeholder="Option A" class="bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required>
        <input type="text" id="optB" placeholder="Option B" class="bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required>
        <input type="text" id="optC" placeholder="Option C" class="bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required>
        <input type="text" id="optD" placeholder="Option D" class="bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400" required>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Correct Answer Option</label>
        <select id="correctOpt" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400">
          <option value="A">Option A</option>
          <option value="B">Option B</option>
          <option value="C">Option C</option>
          <option value="D">Option D</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Detailed Explanation (Vyakhya)</label>
        <textarea id="explanationText" rows="2" placeholder="Sawal ka detail solution..." class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400"></textarea>
      </div>

      <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-extrabold py-3.5 rounded-xl transition shadow-lg text-sm">
        ➕ Add Question & Set Price
      </button>
    </form>
    <div id="statusMsg" class="mt-4 text-center text-sm font-semibold"></div>
  </div>

  <script>
    const firebaseConfig = {
      projectId: "scorecrafter-b4ff1",
      authDomain: "scorecrafter-b4ff1.firebaseapp.com",
      storageBucket: "scorecrafter-b4ff1.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("questionForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("statusMsg");
      status.innerText = "⏳ Saving question...";
      status.className = "mt-4 text-center text-sm font-semibold text-yellow-400";

      try {
        await db.collection("questions").add({
          exam: document.getElementById("examName").value.trim(),
          subject: document.getElementById("subjectName").value.trim(),
          price: Number(document.getElementById("testPrice").value) || 0,
          question: document.getElementById("questionText").value.trim(),
          options: {
            A: document.getElementById("optA").value.trim(),
            B: document.getElementById("optB").value.trim(),
            C: document.getElementById("optC").value.trim(),
            D: document.getElementById("optD").value.trim()
          },
          correctAnswer: document.getElementById("correctOpt").value,
          explanation: document.getElementById("explanationText").value.trim(),
          createdAt: Date.now()
        });

        status.innerText = "✅ Question successfully added with Price setting!";
        status.className = "mt-4 text-center text-sm font-semibold text-green-400";

        // Reset Question fields keeping Exam & Price same for fast entry
        document.getElementById("questionText").value = "";
        document.getElementById("optA").value = "";
        document.getElementById("optB").value = "";
        document.getElementById("optC").value = "";
        document.getElementById("optD").value = "";
        document.getElementById("explanationText").value = "";
      } catch (err) {
        status.innerText = "❌ Error: " + err.message;
        status.className = "mt-4 text-center text-sm font-semibold text-red-400";
      }
    });
  </script>
</body>
</html>
