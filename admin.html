<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreCrafters - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-xl shadow-xl">
        <h2 class="text-2xl font-bold text-yellow-400 mb-6">ScoreCrafters Admin Panel (Add Question)</h2>

        <form onsubmit="addQuestion(event)">
            <!-- Exam and Subject Selection Dropdowns -->
<div class="flex gap-4 mb-4">
  <!-- Exam Category -->
  <div class="flex-1">
    <label class="block text-sm font-semibold mb-1">Select Exam:</label>
    <select id="examCategory" class="w-full p-2 bg-gray-700 rounded text-white">
      <option value="UP Police Constable">UP Police Constable</option>
      <option value="UP Police SI">UP Police SI</option>
      <option value="RPF Constable">RPF Constable</option>
      <option value="RPF SI">RPF SI</option>
      <option value="UP Cooperative Bank">UP Cooperative Bank</option>
        <option value="UPSSSC PET">UPSSSC PET</option>
    </select>
  </div>
  <!-- Subject / Section Selection -->
  <div class="flex-1">
    <label class="block text-sm font-semibold mb-1">Select Subject / Part:</label>
    <select id="subjectCategory" class="w-full p-2 bg-gray-700 rounded text-white">
      <option value="General Knowledge">General Knowledge (GK/GS)</option>
      <option value="Hindi">General Hindi</option>
      <option value="Numerical Ability">Maths (Numerical Ability)</option>
      <option value="Mental Ability">Reasoning / Mental Ability</option>
    </select>
  </div>
</div>
            <!-- Question Hindi -->
           <!-- Question Text (Hindi Only) -->
<div class="mb-4">
  <label class="block text-sm font-semibold mb-1">Question (Hindi):</label>
  <textarea id="qHi" required class="w-full p-2 bg-gray-700 rounded text-white" rows="3" placeholder="Yahan Hindi mein sawaal type karein..."></textarea>
</div>

<!-- 4 Options (Hindi) -->
<div class="grid grid-cols-2 gap-4 mb-4">
  <div>
    <label class="block text-xs text-gray-400 mb-1">Option A</label>
    <input type="text" id="optA" required placeholder="Option A (Hindi)" class="w-full p-2 bg-gray-700 rounded text-white">
  </div>
  <div>
    <label class="block text-xs text-gray-400 mb-1">Option B</label>
    <input type="text" id="optB" required placeholder="Option B (Hindi)" class="w-full p-2 bg-gray-700 rounded text-white">
  </div>
  <div>
    <label class="block text-xs text-gray-400 mb-1">Option C</label>
    <input type="text" id="optC" required placeholder="Option C (Hindi)" class="w-full p-2 bg-gray-700 rounded text-white">
  </div>
  <div>
    <label class="block text-xs text-gray-400 mb-1">Option D</label>
    <input type="text" id="optD" required placeholder="Option D (Hindi)" class="w-full p-2 bg-gray-700 rounded text-white">
  </div>
</div>

<!-- Correct Answer Dropdown -->
<div class="mb-6">
  <label class="block text-sm font-semibold mb-1 text-yellow-400">Select Correct Answer (Sahi Option Chunen):</label>
  <select id="correctAns" required class="w-full p-2 bg-gray-700 rounded text-white border border-yellow-500 font-bold">
    <option value="">-- Choose Correct Option --</option>
    <option value="A">Option A</option>
    <option value="B">Option B</option>
    <option value="C">Option C</option>
    <option value="D">Option D</option>
  </select>
</div>
