<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreCrafters - Online Exam Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .q-btn { width: 34px; height: 34px; font-weight: bold; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px;}
        .answered { background-color: #22c55e; color: white; }
        .marked { background-color: #a855f7; color: white; }
        .not-answered { background-color: #ef4444; color: white; }
        .not-visited { background-color: #e5e7eb; color: #374151; }
    </style>
</head>
<body class="bg-gray-100 font-sans select-none">

    <!-- Header Panel -->
    <header class="bg-indigo-900 text-white p-3 flex justify-between items-center shadow-md">
        <span class="text-2xl font-black text-yellow-400">ScoreCrafters</span>
        <div class="flex items-center space-x-4">
            <div class="bg-indigo-800 p-1 rounded">
                <span class="text-xs mr-2">Language:</span>
                <button onclick="changeLang('hi')" id="btn-hi" class="px-2 py-1 text-xs font-bold bg-yellow-400 text-black rounded">Hindi</button>
                <button onclick="changeLang('en')" id="btn-en" class="px-2 py-1 text-xs font-bold text-white rounded">English</button>
            </div>
            <div class="bg-red-600 px-3 py-1 rounded text-sm font-mono font-bold">Time: <span id="timer">60:00</span></div>
        </div>
    </header>

    <!-- Exam Layout -->
    <div class="max-w-7xl mx-auto m-4 grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <!-- Left Question Box -->
        <div class="lg:col-span-3 bg-white p-6 rounded-lg shadow min-h-[480px] flex flex-col justify-between">
            <div>
                <h3 class="font-bold text-gray-500 border-b pb-2 mb-4" id="q-num">Question 1</h3>
                <p class="text-lg font-semibold text-gray-800 mb-6" id="q-text"></p>
                <div class="space-y-3" id="options-box"></div>
            </div>

            <div class="border-t pt-4 flex justify-between">
                <div class="space-x-2">
                    <button onclick="markForReview()" class="bg-purple-600 text-white px-4 py-2 rounded font-semibold text-sm">Mark for Review</button>
                    <button onclick="clearResponse()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-semibold text-sm">Clear</button>
                </div>
                <div class="space-x-2">
                    <button onclick="prevQ()" class="bg-gray-500 text-white px-4 py-2 rounded font-semibold text-sm">Previous</button>
                    <button onclick="saveNext()" class="bg-green-600 text-white px-6 py-2 rounded font-semibold text-sm">Save & Next</button>
                </div>
            </div>
        </div>

        <!-- Right Palette Box -->
        <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between">
            <div>
                <h4 class="font-bold border-b pb-2 mb-3">Question Palette</h4>
                <div class="grid grid-cols-5 gap-2" id="palette"></div>
            </div>
            <button onclick="submitTest()" class="w-full bg-red-600 text-white font-bold py-2 rounded mt-6">Submit Exam</button>
        </div>
    </div>

    <script>
        let currLang = 'hi';
        let currIdx = 0;

        // Custom Questions Fetch (Local Data or Admin Added Questions)
        let questions = JSON.parse(localStorage.getItem('customQuestions')) || [
            {
                hi: "1. ?????? ??????? ??? ??? ????? ?????????? ????",
                en: "1. How many schedules are there in the Indian Constitution?",
                optsHi: ["10", "12", "14", "15"],
                optsEn: ["10", "12", "14", "15"],
                status: 'not-visited', selected: null
            },
            {
                hi: "2. UP Police ka mukhya nare (Tagline) kya hai?",
                en: "2. What is the tagline of UP Police?",
                optsHi: ["???? ?? ???????", "??????? ????, ?????? ?????", "??????? ????", "?? ????"],
                optsEn: ["Service & Safety", "Security Yours, Our Resolve", "Satyamev Jayate", "Jai Hind"],
                status: 'not-visited', selected: null
            }
        ];

        function render() {
            const q = questions[currIdx];
            document.getElementById('q-num').innerText = `Question ${currIdx + 1}`;
            document.getElementById('q-text').innerText = currLang === 'hi' ? q.hi : q.en;
            const container = document.getElementById('options-box');
            container.innerHTML = '';

            const opts = currLang === 'hi' ? q.optsHi : q.optsEn;
            opts.forEach((opt, idx) => {
                const checked = q.selected === idx ? 'checked' : '';
                container.innerHTML += `
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="opt" value="${idx}" ${checked} class="w-4 h-4 text-indigo-600">
                        <span class="ml-3 font-medium">${opt}</span>
                    </label>`;
            });
            renderPalette();
        }

        function changeLang(l) { currLang = l; render(); }

        function renderPalette() {
            const pal = document.getElementById('palette');
            pal.innerHTML = '';
            questions.forEach((q, i) => {
                pal.innerHTML += `<button onclick="currIdx=${i};render()" class="q-btn ${q.status}">${i+1}</button>`;
            });
        }

        function saveNext() {
            const sel = document.querySelector('input[name="opt"]:checked');
            if(sel) { questions[currIdx].selected = parseInt(sel.value); questions[currIdx].status = 'answered'; }
            else { questions[currIdx].status = 'not-answered'; }
            if(currIdx < questions.length - 1) currIdx++;
            render();
        }

        function markForReview() {
            questions[currIdx].status = 'marked';
            if(currIdx < questions.length - 1) currIdx++;
            render();
        }

        function clearResponse() { questions[currIdx].selected = null; questions[currIdx].status = 'not-answered'; render(); }
        function prevQ() { if(currIdx > 0) { currIdx--; render(); } }
        function submitTest() { alert("Test Submitted Successfully!"); window.location.href="index.html"; }

        render();
    </script>
</body>
</html>
